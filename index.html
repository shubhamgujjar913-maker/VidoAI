<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VidoAI - Image to Video</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #070b09;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 20px;
}

h1 {
  font-size: 30px;
  margin-bottom: 5px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 25px;
}

.card {
  background: #101713;
  border: 1px solid #26332b;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 18px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 10px;
}

input[type="file"] {
  width: 100%;
  padding: 12px;
  background: #080c0a;
  color: white;
  border-radius: 10px;
  border: 1px solid #344139;
}

textarea {
  width: 100%;
  height: 110px;
  background: #080c0a;
  color: white;
  border: 1px solid #344139;
  border-radius: 10px;
  padding: 14px;
  resize: none;
  font-size: 14px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 12px;
}

.generate {
  background: #b7ff19;
  color: #071000;
}

.generate:disabled {
  opacity: .5;
}

#preview {
  width: 100%;
  max-height: 500px;
  object-fit: contain;
  border-radius: 12px;
  background: black;
  display: none;
}

#video {
  width: 100%;
  border-radius: 12px;
  display: none;
  background: black;
}

.download {
  background: #26382d;
  color: white;
  display: none;
}

.status {
  text-align: center;
  margin: 15px 0;
  color: #b7ff19;
}

canvas {
  display: none;
}
</style>
</head>

<body>

<div class="container">

  <h1>🎬 VidoAI</h1>
  <div class="subtitle">
    Turn your image into a cinematic video
  </div>

  <div class="card">

    <label>1. Choose Image</label>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
    >

    <br><br>

    <img id="preview">

  </div>

  <div class="card">

    <label>2. Describe Your Video</label>

    <textarea
      id="prompt"
      placeholder="Example: A man walking through a beautiful jungle, cinematic camera movement, realistic motion, golden sunlight..."
    ></textarea>

  </div>

  <div class="card">

    <button
      class="generate"
      id="generateBtn"
    >
      ✨ Generate Video
    </button>

    <div
      class="status"
      id="status"
    ></div>

    <video
      id="video"
      controls
      playsinline
    ></video>

    <button
      class="download"
      id="downloadBtn"
    >
      ⬇️ Download Video
    </button>

  </div>

</div>

<canvas id="canvas"></canvas>

<script>

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const generateBtn = document.getElementById("generateBtn");
const downloadBtn = document.getElementById("downloadBtn");
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");

let image = new Image();
let imageLoaded = false;
let videoURL = null;

imageInput.addEventListener("change", function () {

  const file = this.files[0];

  if (!file) return;

  const url = URL.createObjectURL(file);

  image.onload = function () {
    imageLoaded = true;
    preview.src = url;
    preview.style.display = "block";

    status.innerText = "✅ Image ready";
  };

  image.src = url;
});


generateBtn.addEventListener("click", async function () {

  if (!imageLoaded) {
    alert("Pehle image select karo.");
    return;
  }

  generateBtn.disabled = true;
  downloadBtn.style.display = "none";
  video.style.display = "none";

  status.innerText = "🎬 Video generate ho raha hai...";

  const ctx = canvas.getContext("2d");

  const width = 720;
  const height = 1280;

  canvas.width = width;
  canvas.height = height;

  const stream = canvas.captureStream(30);

  let mimeType = "";

  if (MediaRecorder.isTypeSupported("video/webm;codecs=vp9")) {
    mimeType = "video/webm;codecs=vp9";
  } else if (MediaRecorder.isTypeSupported("video/webm")) {
    mimeType = "video/webm";
  }

  const recorder = new MediaRecorder(stream, {
    mimeType: mimeType || "video/webm"
  });

  const chunks = [];

  recorder.ondataavailable = function(e) {

    if (e.data && e.data.size > 0) {
      chunks.push(e.data);
    }

  };

  recorder.onstop = function() {

    const blob = new Blob(chunks, {
      type: "video/webm"
    });

    if (videoURL) {
      URL.revokeObjectURL(videoURL);
    }

    videoURL = URL.createObjectURL(blob);

    video.src = videoURL;
    video.style.display = "block";

    downloadBtn.style.display = "block";

    status.innerText = "✅ Video ready!";

    generateBtn.disabled = false;
  };

  recorder.start();

  const duration = 6000;
  const start = performance.now();

  function draw(now) {

    const elapsed = now - start;

    let progress = elapsed / duration;

    if (progress > 1) {
      progress = 1;
    }

    /*
      Smooth cinematic camera movement
    */

    const zoom =
      1.0 +
      progress * 0.18;

    const moveX =
      Math.sin(progress * Math.PI) * 35;

    const moveY =
      Math.sin(progress * Math.PI * 0.8) * 25;

    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, width, height);

    const imageRatio =
      image.width / image.height;

    const canvasRatio =
      width / height;

    let drawWidth;
    let drawHeight;

    if (imageRatio > canvasRatio) {

      drawHeight = height * zoom;
      drawWidth = drawHeight * imageRatio;

    } else {

      drawWidth = width * zoom;
      drawHeight = drawWidth / imageRatio;

    }

    const x =
      (width - drawWidth) / 2 +
      moveX;

    const y =
      (height - drawHeight) / 2 +
      moveY;

    ctx.drawImage(
      image,
      x,
      y,
      drawWidth,
      drawHeight
    );

    if (progress < 1) {

      requestAnimationFrame(draw);

    } else {

      setTimeout(() => {
        recorder.stop();
      }, 300);

    }

  }

  requestAnimationFrame(draw);

});


downloadBtn.addEventListener("click", function () {

  if (!videoURL) return;

  const a = document.createElement("a");

  a.href = videoURL;
  a.download = "VidoAI-video.webm";

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

});


</script>

</body>
</html>
